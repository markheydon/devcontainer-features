name: Test Published Feature

on:
  workflow_run:
    workflows: ["Publish Features"]
    types:
      - completed

permissions:
  contents: read

jobs:
  test-feature:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create test devcontainer.json
        run: |
          mkdir -p .devcontainer
          cat > .devcontainer/devcontainer.json << 'EOF'
          {
            "name": "Test Feature",
            "image": "mcr.microsoft.com/devcontainers/base:ubuntu",
            "features": {
              "ghcr.io/${{ github.repository_owner }}/devcontainer-features/copilot-likes:latest": {}
            }
          }
          EOF

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Start dev container
        run: devcontainer up --workspace-folder .

      - name: Run container and verify installation
        run: |
          devcontainer exec --workspace-folder . bash test/copilot-likes/test.sh

  test-spec-kit:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Keep in sync with src/spec-kit/devcontainer-feature.json pythonVersion default
      PYTHONVERSION: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create test devcontainer.json
        run: |
          mkdir -p .devcontainer .specify
          # Older than typical PyPI latest — postCreate must reinstall specify-cli (see test/spec-kit/test.sh).
          echo '{"speckit_version": "1.3.2"}' > .specify/init-options.json
          cat > .devcontainer/devcontainer.json << EOF
          {
            "name": "Test Spec Kit Feature",
            "image": "mcr.microsoft.com/devcontainers/base:ubuntu",
            "features": {
              "ghcr.io/${{ github.repository_owner }}/devcontainer-features/spec-kit:latest": {
                "pythonVersion": "3.12",
                "specifyVersion": "latest"
              }
            }
          }
          EOF

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Start dev container
        run: devcontainer up --workspace-folder .

      - name: Run container and verify installation
        run: |
          devcontainer exec --workspace-folder . env SPEC_KIT_SYNC_VERIFY_ONLY=1 bash test/spec-kit/test.sh
