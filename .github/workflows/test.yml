name: Test Published Feature

on:
  workflow_run:
    workflows: ["Publish Features"]
    types:
      - completed

permissions:
  contents: read

jobs:
  test-dev-agent-tools:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create test devcontainer.json
        run: |
          mkdir -p .devcontainer
          cat > .devcontainer/devcontainer.json << 'EOF'
          {
            "name": "Test Feature",
            "image": "mcr.microsoft.com/devcontainers/base:ubuntu",
            "features": {
              "ghcr.io/${{ github.repository_owner }}/devcontainer-features/dev-agent-tools:latest": {}
            }
          }
          EOF

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Start dev container
        run: devcontainer up --workspace-folder .

      - name: Run container and verify installation
        run: |
          devcontainer exec --workspace-folder . bash test/dev-agent-tools/test.sh

  test-dev-agent-tools-legacy-id:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create test devcontainer.json
        run: |
          mkdir -p .devcontainer
          cat > .devcontainer/devcontainer.json << 'EOF'
          {
            "name": "Test Legacy Feature Id",
            "image": "mcr.microsoft.com/devcontainers/base:ubuntu",
            "features": {
              "ghcr.io/${{ github.repository_owner }}/devcontainer-features/copilot-likes:latest": {}
            }
          }
          EOF

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Start dev container
        run: devcontainer up --workspace-folder .

      - name: Run container and verify installation
        run: |
          devcontainer exec --workspace-folder . bash test/dev-agent-tools/test.sh

  test-spec-kit:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Keep in sync with src/spec-kit/devcontainer-feature.json pythonVersion default
      PYTHONVERSION: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create test devcontainer.json
        run: |
          mkdir -p .devcontainer .specify
          SYNC_PIN="$(tr -d '[:space:]' < test/spec-kit/sync-target-version.txt)"
          # Pin must stay older than PyPI latest so postCreate reinstalls specify-cli (see src/spec-kit/README.md).
          echo "{\"speckit_version\": \"${SYNC_PIN}\"}" > .specify/init-options.json
          cat > .devcontainer/devcontainer.json << EOF
          {
            "name": "Test Spec Kit Feature",
            "image": "mcr.microsoft.com/devcontainers/base:ubuntu",
            "features": {
              "ghcr.io/${{ github.repository_owner }}/devcontainer-features/spec-kit:latest": {
                "pythonVersion": "3.12",
                "specifyVersion": "latest"
              }
            }
          }
          EOF

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Start dev container
        run: devcontainer up --workspace-folder .

      - name: Run container and verify installation
        run: |
          devcontainer exec --workspace-folder . env SPEC_KIT_SYNC_VERIFY_ONLY=1 bash test/spec-kit/test.sh

  test-aspire-cli-sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare sync smoke workspace
        run: |
          WORKSPACE="${RUNNER_TEMP}/aspire-sync-smoke"
          mkdir -p "${WORKSPACE}/.devcontainer"
          SYNC_PIN="$(tr -d '[:space:]' < test/aspire-cli/sync-target-version.txt)"
          printf '{"sdk": {"version": "%s"}}\n' "${SYNC_PIN}" > "${WORKSPACE}/aspire.config.json"
          cat > "${WORKSPACE}/.devcontainer/devcontainer.json" << EOF
          {
            "name": "Test Aspire CLI sync smoke",
            "image": "mcr.microsoft.com/devcontainers/dotnet:latest",
            "features": {
              "ghcr.io/${{ github.repository_owner }}/devcontainer-features/aspire-cli:latest": {
                "aspireVersion": "latest"
              }
            }
          }
          EOF
          echo "ASPIRE_SYNC_WORKSPACE=${WORKSPACE}" >> "${GITHUB_ENV}"

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Start dev container
        run: devcontainer up --workspace-folder "${ASPIRE_SYNC_WORKSPACE}"

      - name: Verify postCreate sync
        run: |
          devcontainer exec --workspace-folder "${ASPIRE_SYNC_WORKSPACE}" \
            env ASPIRE_CLI_SYNC_VERIFY_ONLY=1 \
            bash "${GITHUB_WORKSPACE}/test/aspire-cli/test.sh"

  test-aspire-cli-workflow:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Aspire app workspace
        run: |
          WORKSPACE="${RUNNER_TEMP}/aspire-app"
          mkdir -p "${WORKSPACE}/.devcontainer"
          cp -a test/aspire-cli/fixtures/run-smoke/. "${WORKSPACE}/"
          cat > "${WORKSPACE}/.devcontainer/devcontainer.json" << EOF
          {
            "name": "Test Aspire CLI workflow smoke",
            "image": "mcr.microsoft.com/devcontainers/dotnet:latest",
            "features": {
              "ghcr.io/${{ github.repository_owner }}/devcontainer-features/aspire-cli:latest": {
                "aspireVersion": "latest"
              }
            }
          }
          EOF
          echo "ASPIRE_APP_WORKSPACE=${WORKSPACE}" >> "${GITHUB_ENV}"

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Start dev container
        run: devcontainer up --workspace-folder "${ASPIRE_APP_WORKSPACE}"

      - name: Verify aspire run from project root
        run: |
          devcontainer exec --workspace-folder "${ASPIRE_APP_WORKSPACE}" \
            env ASPIRE_CLI_WORKFLOW_VERIFY=1 \
            bash "${GITHUB_WORKSPACE}/test/aspire-cli/test.sh"
